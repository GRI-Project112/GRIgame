<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GRI 地下調査</title>
<style>
:root{--bg:#0d1521;--panel:#172435;--line:#58708b;--text:#f4f7fb;--muted:#9fb0c3;--accent:#47b9e8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans JP",sans-serif}
body{min-height:100vh}
.app{width:min(100%,760px);margin:0 auto;padding:14px}
header{border-bottom:1px solid #33475d;padding:4px 0 10px}
.title{font-size:22px;font-weight:800}
.subtitle{font-size:12px;color:var(--muted);margin-top:4px}
.status{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.statusBox,.inventory,.survey,.staminaBox{border:1px solid var(--line);background:rgba(23,36,53,.92);border-radius:12px}
.statusBox{text-align:center;padding:8px}
.statusLabel{font-size:11px;color:var(--muted)}
.statusValue{font-size:17px;font-weight:800;margin-top:2px}
.zoneSelect{display:flex;gap:7px;margin:12px 0 9px}
.zoneButton{flex:1;height:42px;border:1px solid #526a83;border-radius:9px;background:#152131;color:#fff;font-size:14px}
.zoneButton.selected{border:2px solid var(--accent);background:#193246}
.zoneButton:disabled{opacity:.55}
.hint{font-size:11px;color:#b5c2d0;line-height:1.45;margin-bottom:10px}
.staminaBox{padding:9px 11px;margin-bottom:8px}
.staminaLabel{display:flex;justify-content:space-between;font-size:13px;font-weight:700}
.staminaBar{height:7px;background:#0b111a;border-radius:5px;overflow:hidden;margin-top:7px}
.staminaFill{height:100%;width:100%;background:#47b9e8}
.staminaHint{font-size:11px;color:var(--muted);margin-top:5px}
.active{font-size:12px;margin:7px 2px;color:#dbe5ef}
.survey{position:relative;width:100%;height:300px;min-height:300px;max-height:300px;overflow:hidden;background:
linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
#142233;background-size:24px 24px}
@media(min-width:601px){.survey{height:320px;min-height:320px;max-height:320px}}
.survey::before{content:"NEBRA L-N 地下保管区";position:absolute;left:12px;top:10px;color:#71869d;font-size:10px;pointer-events:none}
.survey::after{content:"SCAN AREA";position:absolute;right:12px;bottom:9px;color:#65798f;font-size:10px;letter-spacing:1px;pointer-events:none}
.hazard{
  position:absolute;
  border-radius:50%;
  background:rgba(235,75,75,.22);
  border:1px solid rgba(255,100,100,.65);
  box-shadow:0 0 18px rgba(255,70,70,.2);
  pointer-events:none;
  z-index:4;
}
.excavateLayer{
  position:absolute;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:transparent;
  border:0;
  z-index:5;
  cursor:crosshair;
}
.target{position:absolute;transform:translate(-50%,-50%);width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#263b50;border:2px solid #8ca5bc;z-index:6;user-select:none;touch-action:none;cursor:pointer}
.target.hidden{
  opacity:0 !important;
  visibility:hidden !important;
  pointer-events:none !important;
}
.target.revealed{
  opacity:1 !important;
  visibility:visible !important;
  pointer-events:auto !important;
}
.target.collected{opacity:0;transform:translate(-50%,-50%) scale(.5);transition:.12s}
.target .icon{font-size:21px}
.tap-progress-low{box-shadow:0 0 0 4px rgba(220,70,70,.75)}
.tap-progress-mid{box-shadow:0 0 0 4px rgba(235,180,55,.8)}
.tap-progress-high{box-shadow:0 0 0 4px rgba(70,190,110,.85)}
.tap-progress-complete{box-shadow:0 0 0 5px rgba(80,210,130,.95)}
.inventory{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;overflow:hidden}
.inventoryItem{min-height:58px;text-align:center;padding:8px 4px;border-right:1px solid #3c526a}
.inventoryItem:nth-child(3n){border-right:0}
.inventoryItem:nth-child(n+4){border-top:1px solid #3c526a}
.inventoryName{font-size:10px;color:#c5d2df}
.inventoryCount{font-size:16px;font-weight:800;margin-top:3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.action{height:48px;border-radius:10px;border:1px solid #5a7087;background:#1b2b3e;color:#fff;font-size:15px;font-weight:700}
.action.primary{background:#20536c;border-color:#57c5ee}
.action:disabled{opacity:.55}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:9px 14px;border-radius:9px;background:rgba(5,10,16,.9);border:1px solid #617991;z-index:20;pointer-events:none;opacity:0}
.toast.show{animation:toast 1s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-40%)}20%,75%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-65%)}}
.overlay{position:fixed;inset:0;background:rgba(4,8,14,.78);display:none;align-items:center;justify-content:center;padding:18px;z-index:100}
.overlay.show{display:flex}
.result{width:min(100%,520px);background:#172435;border:1px solid #60778f;border-radius:14px;padding:18px}
.result h2{margin:0 0 12px;font-size:20px}
.resultGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.resultItem{padding:8px;border:1px solid #3d5268;border-radius:7px;font-size:12px}
.resultScore{font-size:26px;font-weight:800;text-align:center;margin:16px 0}

/* Inventory row size normalization */
.inventory{
  align-items:stretch;
}
.inventoryItem{
  min-height:0 !important;
  height:auto !important;
  box-sizing:border-box;
}
.inventoryName{
  line-height:1.2 !important;
  white-space:nowrap;
}
.inventoryCount{
  line-height:1.2 !important;
}

/* 5-column inventory layout */
.inventory{
  display:grid !important;
  grid-template-columns:repeat(5, minmax(0, 1fr)) !important;
  width:100% !important;
}
.inventoryItem{
  min-width:0 !important;
  width:auto !important;
  box-sizing:border-box !important;
}
.inventoryName{
  white-space:normal !important;
  overflow:visible !important;
  text-overflow:clip !important;
  word-break:keep-all !important;
  overflow-wrap:anywhere !important;
  line-height:1.15 !important;
  min-height:2.3em;
  display:flex;
  align-items:center;
  justify-content:center;
}
</style>

<style id="collection-fix">
.target.revealed{
  opacity:1 !important;
  pointer-events:auto !important;
  cursor:pointer;
}
.target.hidden{
  opacity:0 !important;
  pointer-events:none !important;
}
</style>

<style id="mobile-tall-screen">
@media (max-width:600px){
  #survey{
    height:440px !important;
    min-height:440px !important;
    max-height:440px !important;
  }
}

/* 5等分した各欄の縦線を均等に表示 */
.inventoryItem{
  border-right:1px solid #3c526a !important;
}
.inventoryItem:nth-child(3n){
  border-right:1px solid #3c526a !important;
}
.inventoryItem:last-child{
  border-right:0 !important;
}

/* アイテム欄：A〜Dは5等分、Eは6等分 */
.inventory{
  grid-template-columns:repeat(5,minmax(0,1fr)) !important;
}
.inventoryItem{
  border-right:1px solid #3c526a !important;
  border-top:0 !important;
}
.inventoryItem:last-child{
  border-right:0 !important;
}
.inventory.e-zone{
  grid-template-columns:repeat(6,minmax(0,1fr)) !important;
}
.inventory.e-zone .inventoryItem{
  border-right:1px solid #3c526a !important;
  border-top:0 !important;
}
.inventory.e-zone .inventoryItem:last-child{
  border-right:0 !important;
}
@media(max-width:520px){
  .inventory.e-zone .inventoryName{
    font-size:9px !important;
  }
}

.target .icon{
  width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;
  line-height:0;overflow:visible;
}
.target .itemIconImg{
  display:block;flex:0 0 auto;object-fit:contain;
  pointer-events:none;user-select:none;
}
.target .itemIcon-smallStone{width:10px;height:10px;height:18px}
.target .itemIcon-sparkle{width:30px;height:30px;height:32px}
.target .itemIcon-falsar{width:50px;height:50px;height:20px !important;}

.target .itemIcon-fragment{width:40px !important;height:40px !important;}

.target .icon{
  width:54px !important;
  height:54px !important;
  min-width:54px !important;
  min-height:54px !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  overflow:visible !important;
}
.target .itemIconImg{
  flex:0 0 auto !important;
  object-fit:contain !important;
  max-width:none !important;
  max-height:none !important;
}
.target .itemIcon-smallStone{width:10px !important;height:10px !important}
.target .itemIcon-sand{width:20px !important;height:20px !important}
.target .itemIcon-sparkle{width:30px !important;height:30px !important}
.target .itemIcon-fragment{width:40px !important;height:40px !important}
.target .itemIcon-falsar{width:50px !important;height:50px !important}

/* アイテムごとに発掘対象の円そのものも段階的に変更 */
.target{
  width:54px !important;
  height:54px !important;
}
.target-smallStone{
  width:22px !important;
  height:22px !important;
}
.target-sand{
  width:32px !important;
  height:32px !important;
}
.target-sparkle{
  width:42px !important;
  height:42px !important;
}
.target-fragment{
  width:52px !important;
  height:52px !important;
}
.target-falsar{
  width:64px !important;
  height:64px !important;
}

/* 発掘対象：①から⑤へ明確に大型化 */
.target.target-smallStone{
  width:20px !important;
  height:20px !important;
}
.target.target-sand{
  width:35px !important;
  height:35px !important;
}
.target.target-sparkle{
  width:50px !important;
  height:50px !important;
}
.target.target-fragment{
  width:65px !important;
  height:65px !important;
}
.target.target-falsar{
  width:80px !important;
  height:80px !important;
}

/* 円の中のアイコンも①から⑤へ明確に大型化 */
.target.target-smallStone .itemIconImg{
  width:8px !important;
  height:8px !important;
}
.target.target-sand .itemIconImg{
  width:16px !important;
  height:16px !important;
}
.target.target-sparkle .itemIconImg{
  width:28px !important;
  height:28px !important;
}
.target.target-fragment .itemIconImg{
  width:42px !important;
  height:42px !important;
}
.target.target-falsar .itemIconImg{
  width:58px !important;
  height:58px !important;
}

/* 円のサイズ変更に合わせてアイコン用領域も追従 */
.target.target-smallStone .icon{width:20px !important;height:20px !important;}
.target.target-sand .icon{width:35px !important;height:35px !important;}
.target.target-sparkle .icon{width:50px !important;height:50px !important;}
.target.target-fragment .icon{width:65px !important;height:65px !important;}
.target.target-falsar .icon{width:80px !important;height:80px !important;}
</style>

<style>
.form-report-btn{
  display:block;
  width:100%;
  max-width:360px;
  margin:16px auto 0;
  padding:13px 18px;
  border:0;
  border-radius:10px;
  background:#2f6f9f;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}
.form-report-btn:active{transform:translateY(1px);}
</style>

</head>
<body>
<div class="app">
<header>
  <div class="title">GRI 地下調査</div>
  <div class="subtitle">ルメトラ北部 ネブラ L-N地下保管区</div>
  <div class="status">
    <div class="statusBox"><div class="statusLabel">調査区域</div><div class="statusValue" id="zoneLabel">A区</div></div>
    <div class="statusBox"><div class="statusLabel">残り時間</div><div class="statusValue" id="timeLabel">60</div></div>
    <div class="statusBox"><div class="statusLabel">ポイント</div><div class="statusValue" id="scoreLabel">0</div></div>
  </div>
</header>

<main>
  <div class="zoneSelect">
    <button class="zoneButton selected" data-zone="A">A区</button>
    <button class="zoneButton" data-zone="B">B区</button>
    <button class="zoneButton" data-zone="C">C区</button>
    <button class="zoneButton" data-zone="D">D区</button>
    <button class="zoneButton" data-zone="E">E区</button>
  </div>

  <div class="hint">スマホ：指でドラッグして発掘 → アイテムをタップして回収　／　PC：マウス左ボタンでドラッグして発掘 → アイテムをクリックして回収</div>

  <div class="staminaBox">
    <div class="staminaLabel"><span>スタミナ</span><span id="staminaText">100 / 100</span></div>
    <div class="staminaBar"><div class="staminaFill" id="staminaFill"></div></div>
    <div class="staminaHint">発掘中に減少・時間経過で少量回復</div>
  </div>

  <div class="active" id="activeTargetCount">発掘対象：10個</div>
  <div class="survey" id="survey"><div class="toast" id="toast"></div></div>

  <div class="inventory">
    <div class="inventoryItem"><div class="inventoryName">小さな石</div><div class="inventoryCount" id="iStone">0</div></div>
    <div class="inventoryItem"><div class="inventoryName">細かい砂</div><div class="inventoryCount" id="iSand">0</div></div>
    <div class="inventoryItem"><div class="inventoryName">きらめく石</div><div class="inventoryCount" id="iSparkle">0</div></div>
    <div class="inventoryItem"><div class="inventoryName">ファルサー片</div><div class="inventoryCount" id="iFragment">0</div></div>
    <div class="inventoryItem"><div class="inventoryName">古代ファルサー</div><div class="inventoryCount" id="iFalsar">0</div></div>
    <div class="inventoryItem" id="luciferInventory"><div class="inventoryName">ルシフェスの欠片</div><div class="inventoryCount" id="iLucifer">0</div></div>
  </div>

  <div class="actions">
    <button class="action primary" id="startButton">調査開始</button>
    <button class="action" id="resetButton">リセット</button>
  </div>
</main>
</div>

<div class="overlay" id="resultOverlay">
  <div class="result">
    <h2>調査結果</h2>
    <div class="resultGrid" id="resultItems"></div>
    <div class="resultScore" id="resultScore">0 pt</div>
    <button class="action primary" id="resultClose" style="width:100%">確認する</button>
  </div>
</div>

<script>
(() => {
"use strict";

const MAX_STAMINA=100;
const DRAIN=18;
const RECOVER=6;
const TIME_LIMIT=60;

const CONFIG={
  pointsByZone:{
    A:{smallStone:1,sand:2,sparkle:3,fragment:5,falsar:10,lucifer:0},
    B:{smallStone:2,sand:3,sparkle:6,fragment:7,falsar:13,lucifer:0},
    C:{smallStone:3,sand:4,sparkle:7,fragment:10,falsar:16,lucifer:0},
    D:{smallStone:4,sand:5,sparkle:8,fragment:13,falsar:20,lucifer:0},
    E:{smallStone:5,sand:6,sparkle:9,fragment:17,falsar:26,lucifer:40}
  },
  names:{smallStone:"小さな石",sand:"細かい砂",sparkle:"きらめく石",fragment:"古代ファルサー片",falsar:"古代ファルサー",lucifer:"ルシフェスの欠片"},
  icon:{smallStone:"●",sand:"··",sparkle:"✦",fragment:"◆",falsar:"◇",lucifer:"✧"},
  zones:{
    A:{label:"A区",weights:[["smallStone",40],["sand",30],["sparkle",20],["fragment",9],["falsar",1]],hazards:0},
    B:{label:"B区",weights:[["smallStone",30],["sand",20],["sparkle",30],["fragment",18],["falsar",2]],hazards:1},
    C:{label:"C区",weights:[["smallStone",10],["sand",20],["sparkle",40],["fragment",26],["falsar",4]],hazards:2},
    D:{label:"D区",weights:[["smallStone",5],["sand",5],["sparkle",50],["fragment",32],["falsar",8]],hazards:3},
    E:{label:"E区",weights:[["smallStone",2],["sand",8],["sparkle",30],["fragment",44],["falsar",15],["lucifer",1]],hazards:5}
  },
  penalty:{
    B:{chance:.12,time:2,points:1},
    C:{chance:.22,time:3,points:2},
    D:{chance:.35,time:5,points:3},
    E:{chance:.50,time:7,points:5}
  }
};

const taps={smallStone:1,sand:1,sparkle:2,fragment:3,falsar:4,lucifer:8};
const survey=document.getElementById("survey");
const timeLabel=document.getElementById("timeLabel");
const scoreLabel=document.getElementById("scoreLabel");
const zoneLabel=document.getElementById("zoneLabel");
const startButton=document.getElementById("startButton");
const resetButton=document.getElementById("resetButton");
const resultOverlay=document.getElementById("resultOverlay");
const resultItems=document.getElementById("resultItems");
const resultScore=document.getElementById("resultScore");
const toast=document.getElementById("toast");
const staminaText=document.getElementById("staminaText");
const staminaFill=document.getElementById("staminaFill");
const activeCount=document.getElementById("activeTargetCount");

let state={
  zone:"A",running:false,time:TIME_LIMIT,score:0,stamina:MAX_STAMINA,
  timer:null,staminaFrame:null,drag:false,last:null,previousPointer:null,hazardLockUntil:0,
  counts:{smallStone:0,sand:0,sparkle:0,fragment:0,falsar:0,lucifer:0}
};

function weighted(weights){
  let r=Math.random()*100;
  for(const [type,w] of weights){r-=w;if(r<=0)return type;}
  return weights[weights.length-1][0];
}
function pos(){
  return {x:8+Math.random()*84,y:10+Math.random()*80};
}
function updateInventory(){
  const c=state.counts;
  const map={iStone:c.smallStone,iSand:c.sand,iSparkle:c.sparkle,iFragment:c.fragment,iFalsar:c.falsar,iLucifer:c.lucifer};
  for(const [id,v] of Object.entries(map)){document.getElementById(id).textContent=String(v);}
  const luciferInventory=document.getElementById("luciferInventory");
  if(luciferInventory) luciferInventory.style.display=state.zone==="E" ? "" : "none";
  const inventory=document.querySelector(".inventory");
  if(inventory) inventory.classList.toggle("e-zone", state.zone==="E");
}
function updateStamina(){
  staminaText.textContent=Math.round(state.stamina)+" / 100";
  staminaFill.style.width=Math.max(0,state.stamina)+"%";
}
function updateActive(){
  activeCount.textContent="発掘対象："+survey.querySelectorAll(".target:not(.collected)").length+"個";
}
function showToast(text){
  toast.textContent=text;
  toast.classList.remove("show");
  void toast.offsetWidth;
  toast.classList.add("show");
}
function makeHazards(){
  survey.querySelectorAll(".hazard").forEach(e=>e.remove());

  const n=CONFIG.zones[state.zone].hazards;
  for(let i=0;i<n;i++){
    const h=document.createElement("div");
    h.className="hazard";

    const s=75+Math.random()*70;
    h.style.width=s+"px";
    h.style.height=s+"px";

    const rect=survey.getBoundingClientRect();
    const maxX=Math.max(0,rect.width-s);
    const maxY=Math.max(0,rect.height-s);

    h._x=Math.random()*maxX;
    h._y=Math.random()*maxY;

    // 難易度に応じて速度を上げる
    const speed={
      A:0,
      B:0.75,
      C:1.05,
      D:1.35,
      E:1.7
    }[state.zone] || 1;

    const angle=Math.random()*Math.PI*2;
    h._vx=Math.cos(angle)*speed;
    h._vy=Math.sin(angle)*speed;

    h.style.left=h._x+"px";
    h.style.top=h._y+"px";

    survey.appendChild(h);
  }
}

let hazardFrame=null;
let hazardLast=0;

function animateHazards(now){
  if(!state.running){
    hazardFrame=null;
    hazardLast=0;
    return;
  }

  if(!hazardLast)hazardLast=now;
  const dt=Math.min(32,now-hazardLast);
  hazardLast=now;

  const rect=survey.getBoundingClientRect();

  survey.querySelectorAll(".hazard").forEach(h=>{
    const w=h.offsetWidth;
    const hh=h.offsetHeight;

    h._x+=h._vx*(dt/16.67);
    h._y+=h._vy*(dt/16.67);

    if(h._x<=0){
      h._x=0;
      h._vx=Math.abs(h._vx);
    }else if(h._x+w>=rect.width){
      h._x=Math.max(0,rect.width-w);
      h._vx=-Math.abs(h._vx);
    }

    if(h._y<=0){
      h._y=0;
      h._vy=Math.abs(h._vy);
    }else if(h._y+hh>=rect.height){
      h._y=Math.max(0,rect.height-hh);
      h._vy=-Math.abs(h._vy);
    }

    h.style.left=h._x+"px";
    h.style.top=h._y+"px";
  });

  hazardFrame=requestAnimationFrame(animateHazards);
}

function startHazardMotion(){
  cancelAnimationFrame(hazardFrame);
  hazardFrame=null;
  hazardLast=0;

  if(CONFIG.zones[state.zone].hazards>0){
    hazardFrame=requestAnimationFrame(animateHazards);
  }
}

function stopHazardMotion(){
  cancelAnimationFrame(hazardFrame);
  hazardFrame=null;

function spawnTarget(){
  if(!state.running)return;
  if(survey.querySelectorAll(".target:not(.collected)").length>=10)return;
  const type=weighted(CONFIG.zones[state.zone].weights);
  const p=pos(),id=Math.random().toString(36).slice(2);
  const cover=document.createElement("div");
  cover.className="excavateLayer";
  cover.dataset.id=id;
  cover.style.left=p.x+"%";cover.style.top=p.y+"%";
  const size=66+Math.random()*24;
  cover.style.width=size+"px";cover.style.height=size+"px";
  survey.appendChild(cover);

  const target=document.createElement("div");

  target.className="target hidden target-"+type;
  const targetSizes={
    smallStone:20,
    sand:35,
    sparkle:50,
    fragment:65,
    falsar:80
  };
  const targetSize=targetSizes[type] || 42;
  target.style.width=targetSize+"px";
  target.style.height=targetSize+"px";
  target.dataset.id=id;target.dataset.type=type;target.dataset.taps="0";
  target.style.left=p.x+"%";target.style.top=p.y+"%";
  target.innerHTML='<div class="icon">'+(
    type==="smallStone" ? ITEM_ICON_HTML.smallStone :
    type==="sand" ? ITEM_ICON_HTML.sand :
    type==="sparkle" ? ITEM_ICON_HTML.sparkle :
    type==="fragment" ? ITEM_ICON_HTML.fragment :
    type==="falsar" ? ITEM_ICON_HTML.falsar :
    ""
  )+'</div>';
  target.addEventListener("pointerdown",e=>{
    if(!state.running || !target.classList.contains("revealed")) return;
    e.preventDefault();
    e.stopPropagation();
    collect(target);
  });
  survey.appendChild(target);
}
function revealAt(x,y){
  if(!state.running || state.stamina<=0)return;
  for(const cover of [...survey.querySelectorAll(".excavateLayer")]){
    const r=cover.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom){
      const id=cover.dataset.id;
      const target=survey.querySelector('.target[data-id="'+id+'"]');
      if(target){
        target.classList.remove("hidden");
        target.classList.add("revealed");
        cover.remove();
        return true;
      }
    }
  }
  return false;
}
function collect(target){
  if(!state.running || !target || !target.classList.contains("revealed")) return;
  const type=target.dataset.type;
  let n=Number(target.dataset.taps)+1;
  target.dataset.taps=String(n);
  const need=taps[type];
  if(n<need){
    target.classList.remove("tap-progress-low","tap-progress-mid","tap-progress-high");
    target.classList.add(n>=Math.ceil(need/2)?"tap-progress-mid":"tap-progress-low");
    if(need-n===1)target.classList.replace("tap-progress-mid","tap-progress-high");
    showToast("あと"+(need-n)+"回タップ");
    return;
  }
  target.classList.add("collected");
  state.counts[type]++;
  state.score+=CONFIG.pointsByZone[state.zone][type];
  window.GRI_SCORE=state.score;
  scoreLabel.textContent=String(state.score);
  updateInventory();
  showToast(CONFIG.names[type]+"を獲得");
  const cover=survey.querySelector('.excavateLayer[data-id="'+target.dataset.id+'"]');
  if(cover)cover.remove();
  setTimeout(()=>target.remove(),120);
  setTimeout(()=>{if(state.running)spawnTarget();updateActive();},130);
}
function getHazardCircle(hazard){
  const r=hazard.getBoundingClientRect();
  return {
    x:r.left+r.width/2,
    y:r.top+r.height/2,
    radius:Math.min(r.width,r.height)/2
  };
}

function pointInCircle(x,y,c){
  const dx=x-c.x,dy=y-c.y;
  return dx*dx+dy*dy<=c.radius*c.radius;
}

function segmentIntersectsCircle(x1,y1,x2,y2,c){
  const vx=x2-x1,vy=y2-y1;
  const wx=c.x-x1,wy=c.y-y1;
  const len2=vx*vx+vy*vy;

  let t=len2>0?(wx*vx+wy*vy)/len2:0;
  t=Math.max(0,Math.min(1,t));

  const px=x1+vx*t,py=y1+vy*t;
  const dx=px-c.x,dy=py-c.y;
  return dx*dx+dy*dy<=c.radius*c.radius;
}

function pointerTouchesHazard(x,y,previous){
  for(const hazard of survey.querySelectorAll(".hazard")){
    const circle=getHazardCircle(hazard);

    // 現在位置が触れている
    if(pointInCircle(x,y,circle))return true;

    // 前回位置から今回位置までのドラッグ経路が危険エリアを横切った
    if(previous && segmentIntersectsCircle(previous.x,previous.y,x,y,circle))return true;
  }
  return false;
}
function applyHazardPenalty(){
  if(!state.running||!state.drag||!state.last)return;
  if(!pointerTouchesHazard(state.last.x,state.last.y,state.previousPointer))return;

  const now=performance.now();

  // 同じ接触を連続で何度も罰しない
  if(state.hazardLockUntil && now<state.hazardLockUntil)return;
  state.hazardLockUntil=now+650;

  const p=CONFIG.penalty[state.zone];
  if(!p)return;

  const oldTime=state.time;
  const oldScore=state.score;

  // 危険エリアへの接触は確実に罰則
  state.time=Math.max(0,state.time-p.time);
  state.score=Math.max(0,state.score-p.points);
  state.counts.miss++;

  timeLabel.textContent=String(state.time);
  scoreLabel.textContent=String(state.score);
  updateInventory();

  const tl=oldTime-state.time;
  const sl=oldScore-state.score;

  if(tl>0&&sl>0){
    showToast("危険エリア接触：残り時間 -"+tl+"秒 / ポイント -"+sl+"pt");
  }else if(tl>0){
    showToast("危険エリア接触：残り時間 -"+tl+"秒");
  }else{
    showToast("危険エリア接触：ポイント -"+sl+"pt");
  }

  if(state.time<=0)finish();
}
function start(){
  if(state.running)return;
  state.running=true;state.time=TIME_LIMIT;state.score=0;window.GRI_SCORE=0;state.stamina=MAX_STAMINA;
  state.counts={smallStone:0,sand:0,sparkle:0,fragment:0,falsar:0,lucifer:0,miss:0};
  timeLabel.textContent="60";scoreLabel.textContent="0";updateInventory();updateStamina();
  survey.innerHTML='<div class="toast" id="toast"></div>';
  // refresh toast reference
  window.toast=document.getElementById("toast");
  makeHazards();
  startHazardMotion();
  for(let i=0;i<10;i++)spawnTarget();
  updateActive();
  startButton.disabled=true;
  document.querySelectorAll(".zoneButton").forEach(b=>b.disabled=true);
  clearInterval(state.timer);
  state.timer=setInterval(()=>{
    if(!state.running)return;
    state.time=Math.max(0,state.time-1);
    timeLabel.textContent=String(state.time);
    if(state.time<=0)finish();
  },1000);
}
function finish(){
  if(!state.running)return;
  state.running=false;
  clearInterval(state.timer);
  stopHazardMotion();
  resultItems.innerHTML="";
  const labels={smallStone:"小さな石",sand:"細かい砂",sparkle:"きらめく石",fragment:"古代ファルサー片",falsar:"古代ファルサー",lucifer:"ルシフェスの欠片"};
  for(const [k,label] of Object.entries(labels)){
    const d=document.createElement("div");d.className="resultItem";d.textContent=label+"："+state.counts[k];resultItems.appendChild(d);
  }
  resultScore.textContent=state.score+" pt";
  resultOverlay.classList.add("show");
  startButton.disabled=false;
  document.querySelectorAll(".zoneButton").forEach(b=>b.disabled=false);
}
function reset(){
  state.running=false;clearInterval(state.timer);
  stopHazardMotion();
  state.time=TIME_LIMIT;state.score=0;window.GRI_SCORE=0;state.stamina=MAX_STAMINA;
  state.counts={smallStone:0,sand:0,sparkle:0,fragment:0,falsar:0,lucifer:0};state.last=null;state.previousPointer=null;state.hazardLockUntil=0;
  survey.innerHTML='<div class="toast" id="toast"></div>';
  timeLabel.textContent="60";scoreLabel.textContent="0";updateInventory();updateStamina();
  updateActive();resultOverlay.classList.remove("show");
  startButton.disabled=false;document.querySelectorAll(".zoneButton").forEach(b=>b.disabled=false);
}
function staminaLoop(){
  if(state.running){
    if(state.drag)state.stamina=Math.max(0,state.stamina-DRAIN/60);
    else state.stamina=Math.min(MAX_STAMINA,state.stamina+RECOVER/60);
    updateStamina();
  }
  requestAnimationFrame(staminaLoop);
}
function pointerPos(e){return {x:e.clientX,y:e.clientY};}
survey.addEventListener("pointerdown",e=>{
  if(!state.running)return;

  const t=e.target.closest(".target");
  if(t&&t.classList.contains("revealed"))return;

  state.drag=true;
  state.last=pointerPos(e);
  state.previousPointer=state.last;

  revealAt(e.clientX,e.clientY);
  applyHazardPenalty();

  try{survey.setPointerCapture?.(e.pointerId)}catch(_){}
});

survey.addEventListener("pointermove",e=>{
  if(!state.running||!state.drag)return;

  const current=pointerPos(e);
  state.previousPointer=state.last;
  state.last=current;

  // 現在位置だけでなく、前回位置から現在位置までの
  // ドラッグ経路も判定する
  revealAt(e.clientX,e.clientY);
  applyHazardPenalty();
});

survey.addEventListener("pointerup",()=>{
  state.drag=false;
  state.last=null;
  state.previousPointer=null;
  state.hazardLockUntil=0;
});

survey.addEventListener("pointercancel",()=>{
  state.drag=false;
  state.last=null;
  state.previousPointer=null;
  state.hazardLockUntil=0;
});

startButton.addEventListener("click",start);
resetButton.addEventListener("click",reset);
document.getElementById("resultClose").addEventListener("click",reset);
document.querySelectorAll(".zoneButton").forEach(btn=>btn.addEventListener("click",()=>{
  if(state.running)return;
  document.querySelectorAll(".zoneButton").forEach(b=>b.classList.remove("selected"));
  btn.classList.add("selected");
  state.zone=btn.dataset.zone;
  zoneLabel.textContent=CONFIG.zones[state.zone].label;
  updateInventory();
}));
updateInventory();updateStamina();updateActive();staminaLoop();
})();
</script>

<script>
function openGoogleFormWithScore(score){
  const formUrl = "https://docs.google.com/forms/d/e/1FAIpQLSf084knzHYcfUG2b_TPdJjdIG0CE-dopw8shept_4c9m6qs0Q/viewform?usp=pp_url&entry.1434952191=" + encodeURIComponent(String(score));
  window.open(formUrl, "_blank");
}
</script>


<script>
(function(){
  function getScore(){
    const n=Number(window.GRI_SCORE);
    return Number.isFinite(n) ? n : 0;
  }
  function addReportButton(){
    if(document.querySelector(".form-report-btn")) return;
    const candidates=[
      document.querySelector("#result"),
      document.querySelector(".result"),
      document.querySelector(".result-screen"),
      document.querySelector(".resultPanel"),
      document.querySelector(".result-panel")
    ].filter(Boolean);
    for(const root of candidates){
      const visible=root.offsetParent!==null;
      if(!visible) continue;
      const btn=document.createElement("button");
      btn.type="button";
      btn.className="form-report-btn";
      btn.textContent="Googleフォームへ報告する";
      btn.addEventListener("click",function(){
        openGoogleFormWithScore(getScore());
      });
      root.appendChild(btn);
      return;
    }
  }
  const observer=new MutationObserver(function(){ addReportButton(); });
  observer.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:["style","class"]});
  setInterval(addReportButton,500);
})();
</script>
